[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverus-editor"
version = "0.1.0"
description = "In Verus 双平面音游谱面编辑器（6K 下落式 + 鼠标平面）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "In Verus Project" }]
dependencies = []

[project.optional-dependencies]
audio = ["pygame-ce>=2.4"]

[project.scripts]
inverus-editor = "rhythm_editor.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
