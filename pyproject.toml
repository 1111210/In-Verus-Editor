[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infalsus-editor"
version = "0.1.0"
description = "《In Falsus》社区谱面编辑器（6K 下落式 + 鼠标平面）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "In Falsus Community" }]
dependencies = []

[project.optional-dependencies]
# 真实音频播放；演示模式（软件渲染的游玩视角预览）同样使用它
audio = ["pygame-ce>=2.5.0", "numpy>=1.26"]
preview = ["pygame-ce>=2.5.0"]
all = ["pygame-ce>=2.5.0", "numpy>=1.26"]
# 仅构建 Windows 发布包时需要
build = ["pyinstaller>=6.22.3"]

[project.scripts]
infalsus-editor = "app:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "app",
    "audio",
    "chart_io",
    "config",
    "demo",
    "editor_settings",
    "global_settings",
    "metronome",
    "settings_store",
    "shortcuts",
]
packages = ["model", "preview", "ui"]
